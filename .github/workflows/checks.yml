name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check committed whitespace
        run: git show --format= --check HEAD
      - name: Check planning JSON syntax
        run: jq empty examples/*.json schemas/*.json model/*.json
      - name: Set up model-validation tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install model-validation dependencies
        run: python -m pip install -r tools/model/requirements.txt
      - name: Validate domain model
        run: python tools/model/validate_model.py --baseline-ref HEAD^
      - name: Check model rejection cases
        run: python -m unittest discover -s tools/model/tests -v
